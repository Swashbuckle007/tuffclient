<!doctype html>
<html lang="en">

<head>
  <title>TuffClient</title>
  <meta charset="utf-8" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link type="text/css" rel="stylesheet" href="files.css" />
</head>

<body>
  <div class="container">
    <header class="header">
      <h1 class="logo">Swashbuckle007's Hacked Clients</h1>
      <nav class="nav">
        <button class="nav-btn active" data-section="latest">Latest</button>
      </nav>
    </header>

    <main>
      <section id="latest" class="section active">
        <div class="section-header">
          <h2>Latest Added</h2>
          <span class="badge">Wurst</span>
        </div>
        
        <div class="card">
          <h3>Wurst</h3>
          <div class="link-group">
            <a href="files/Wurst/WASM" class="btn btn-primary">WASM Version</a>
          </div>
        </div>

        

     

   

      </section>

      
      
    </main>
  </div>

  <script>
    document.querySelectorAll('.nav-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        document.querySelectorAll('.nav-btn').forEach(function (b) { b.classList.remove('active'); });
        document.querySelectorAll('.section').forEach(function (s) { s.classList.remove('active'); });
        btn.classList.add('active');
        document.getElementById(btn.dataset.section).classList.add('active');
      });
    });

    if ('serviceWorker' in navigator) {
      var swReady = navigator.serviceWorker.register('/sw.js').then(function () {
        if (navigator.serviceWorker.controller) return;
        return new Promise(function (r) {
          navigator.serviceWorker.addEventListener('controllerchange', r, { once: true });
        });
      });

      document.addEventListener('click', function (e) {
        var link = e.target.closest('a[href*="/files/"]');
        if (!link) return;
        e.preventDefault();
        swReady.then(function () { location.href = link.href; });
      });
    }
  </script>
</body>

</html>
