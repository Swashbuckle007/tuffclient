<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Beta Version</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            max-width: 600px;
        }
        button {
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-left: 5px solid #28a745;
        }
        .error {
            border-left-color: #dc3545 !important;
            color: #dc3545;
        }
    </style>
</head>
<body>

    <h2>Fetch Beta Version</h2>
    
    <button onclick="fetchSecondLine()">Get Data</button>

    <div id="result" style="display: none;"></div>

    <script>
        async function fetchSecondLine() {
            // Change this to your actual, locked URL
            const TARGET_URL = 'https://raw.githubusercontent.com/TuffNetwork/version/refs/heads/main/version.txt'; 
            
            const resultDiv = document.getElementById('result');
            
            // Reset display
            resultDiv.style.display = 'none';
            resultDiv.className = '';

            try {
                // Fetch the file content from the locked URL
                const response = await fetch(TARGET_URL);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const text = await response.text();

                // Split the text by newline characters
                const lines = text.split(/\r?\n/);

                // Check if the second line exists (index 1)
                if (lines.length >= 3) {
                    resultDiv.textContent = `Beta Version: "${lines[1]}"`;
                } else {
                    resultDiv.textContent = "The file was fetched, but it doesn't contain a beta version.";
                }
                
                resultDiv.style.display = 'block';

            } catch (error) {
                resultDiv.textContent = `Error: ${error.message}. (Note: Ensure the file server allows CORS requests).`;
                resultDiv.className = 'error';
                resultDiv.style.display = 'block';
            }
        }
    </script>

</body>
</html>
